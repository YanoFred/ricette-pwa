name: CI e Deploy PWA Ricette su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Typecheck, Lint e Test Unitari/Componenti
        run: npm run typecheck && npm run lint && npm run test

      - name: Build PWA Produzione
        run: npm run build

      - name: Installa browser Playwright e lancia E2E Pixel 7
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica artifact dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
